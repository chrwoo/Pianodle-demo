<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Pianodle - Daily</title>

    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="home-button-container">
        <div class="home-button">
            Pianodle
        </div>
    </div>

    <div id="guess-container">
        <div class="guess-block-select"></div>
        <div class="guess-block-blank"></div>
        <div class="guess-block-blank"></div>
        <div class="guess-block-blank"></div>
        <div class="guess-block-blank"></div>
        <div class="guess-block-blank"></div>
    </div>

    <div id="audio-container">
        <div id="progress-bar-container">
            <!-- For drawing separation lines -->
            <div></div><div></div><div></div><div></div><div></div><div></div>

            <div id="progress-bar"></div>
        </div>

        <audio id="audio-player"></audio>
        <button id="play-button">
            <img id="play-button-icon" src="../assets/images/play-button.svg" alt="Play">
        </button>
    </div>

    <div class="search-container">
        <img class="search-icon" src="../assets/images/magnifying-glass.png">
        <input type="text" id="search-bar" placeholder="Guess the piece" required autocomplete="off">
        <img id="clear-search-button" src="../assets/images/clear-search-icon.svg">
        <div id="dropdown"></div>

        <button id="skip-button">Skip</button>
        <button id="guess-button">Guess</button>
    </div>

    <dialog id="end-screen" closedby="any">
        <div id="end-screen-title">Keep Playing!</div>
        <div id="end-screen-text">Game not finished</div>
        <div id="end-screen-answer">
            <div id="end-screen-answer-title"></div>
            <div id="end-screen-answer-other"></div>
        </div>
        <div id="end-screen-guess-num"></div>

        <button id="close-end-screen-button">
            <img src="../assets/images/clear-search-icon.svg" alt="Close">
        </button>
        
        <div class="youtube-button-container">
            Listen to the full piece:
            <a id="youtube-button" target="_blank" href="https://youtube.com">
                <img id="youtube-button-icon" src="../assets/images/youtube-icon.png" alt="YouTube">
            </a>
        </div>
    </dialog>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="js/main.js"></script>

</body>
